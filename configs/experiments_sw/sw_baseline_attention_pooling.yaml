contrastive:
  batch_size: 64
  enabled: false
  epochs: 50
  freeze_tst1: false
  freeze_tst2: false
  loss_type: infonce
  lr: 0.0001
  proj_hidden_dim: 256
  proj_output_dim: 128
  temperature: 0.07
  weight_decay: 0.0001
data:
  data_path: /root/autodl-tmp/TwoTST/data/processed_sw/processed_data.pkl
  sliding_window:
    enabled: true
    stride: 16
    window_size: 32
  split_ratio:
    test: 0.2
    train: 0.7
    val: 0.1
experiment:
  description: 滑动窗口+Attention Pooling融合
  name: sw_baseline_attention_pooling
finetune:
  batch_size: 64
  classifier:
    dropout: 0.3
    hidden_dims:
    - 256
    - 64
  epochs: 100
  freeze_tst1: false
  freeze_tst2: false
  lr: 5.0e-05
  patience: 20
  save_dir: /root/autodl-tmp/TwoTST/checkpoints_sw/finetune/sw_baseline_attention_pooling
  weight_decay: 0.0001
fusion:
  attention_pooling:
    hidden_dim: 256
  bilinear:
    output_dim: 256
  concat:
    hidden_dim: 512
  cross_attention:
    dropout: 0.1
    n_heads: 8
  gated:
    hidden_dim: 512
  type: attention_pooling
  use_tst1: true
  use_tst2: true
logging:
  log_dir: /root/autodl-tmp/TwoTST/logs_sw/sw_baseline_attention_pooling
  tensorboard: true
model:
  tst1:
    dim_feedforward: 2048
    dropout: 0.1
    emb_dim: 512
    max_seq_len: 32
    n_heads: 8
    n_layers: 6
    n_rois: 200
  tst2:
    d_model: 256
    dim_feedforward: 512
    dropout: 0.1
    n_heads: 8
    n_layers: 2
    pcc_dim: 19900
pretrain:
  tst1:
    checkpoint: /root/autodl-tmp/TwoTST/checkpoints_sw/tst1/tst1_best.pt
  tst2:
    checkpoint: /root/autodl-tmp/TwoTST/checkpoints_sw/tst2/tst2_best.pt
  use_pretrained: true
training:
  device: cuda
  num_workers: 4
  seed: 42
