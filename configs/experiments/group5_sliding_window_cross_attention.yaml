# 实验组5: 滑动窗口数据增强实验
# 使用滑动窗口增强预训练数据

experiment:
  name: "sliding_window_cross_attention"
  description: "滑动窗口增强实验：使用Cross Attention融合"
  group: "augmentation"

data:
  data_path: /root/workplace/exp/TwoTST/data/processed/processed_data.pkl
  n_rois: 200
  time_points: 100
  pcc_dim: 19900
  split_ratio:
    train: 0.7
    val: 0.1
    test: 0.2
  # 启用滑动窗口数据增强
  sliding_window:
    enabled: true
    window_size: 50
    stride: 25

pretrain:
  use_pretrained: false  # 需要重新预训练
  tst1:
    epochs: 100
    batch_size: 32
    lr: 1e-4
    weight_decay: 1e-4
    mask_ratio: null
    checkpoint: null
  tst2:
    epochs: 100
    batch_size: 32
    lr: 1e-4
    weight_decay: 1e-4
    mask_ratio: 0.15
    checkpoint: null

model:
  tst1:
    emb_dim: 512
    n_heads: 8
    n_layers: 6
    dim_feedforward: 2048
    dropout: 0.1
  tst2:
    d_model: 256
    n_heads: 8
    n_layers: 2
    dim_feedforward: 512
    dropout: 0.1

contrastive:
  enabled: false

fusion:
  type: cross_attention
  use_tst1: true
  use_tst2: true
  cross_attention:
    n_heads: 8
    dropout: 0.1

finetune:
  epochs: 100
  batch_size: 32
  lr: 5e-5
  weight_decay: 1e-4
  patience: 20
  n_folds: 5
  freeze_tst1: false
  freeze_tst2: false
  feature_source: "pretrain"
  classifier:
    hidden_dims: [256, 64]
    dropout: 0.3
  save_dir: /root/workplace/exp/TwoTST/checkpoints/finetune/sliding_window_cross_attention

training:
  device: cuda
  seed: 42
  num_workers: 4

logging:
  log_dir: /root/workplace/exp/TwoTST/logs/sliding_window_cross_attention
  tensorboard: true
  save_best_only: true

evaluation:
  metrics: [auc, accuracy, sensitivity, specificity, f1]
  primary_metric: auc
