# 实验组1: 基线实验 - Cross Attention融合
# 无对比学习，无滑动窗口增强

experiment:
  name: "baseline_cross_attention"
  description: "基线实验：无对比学习，使用Cross Attention融合"
  group: "baseline"

data:
  data_path: /root/workplace/exp/TwoTST/data/processed/processed_data.pkl
  n_rois: 200
  time_points: 100
  pcc_dim: 19900
  split_ratio:
    train: 0.7
    val: 0.1
    test: 0.2
  sliding_window:
    enabled: false

pretrain:
  use_pretrained: true
  tst1:
    checkpoint: /root/workplace/exp/TwoTST/checkpoints/tst1/tst1_best.pt
  tst2:
    checkpoint: /root/workplace/exp/TwoTST/checkpoints/tst2/tst2_best.pt

model:
  tst1:
    emb_dim: 512
    n_heads: 8
    n_layers: 6
    dim_feedforward: 2048
    dropout: 0.1
  tst2:
    d_model: 256
    n_heads: 8
    n_layers: 2
    dim_feedforward: 512
    dropout: 0.1

contrastive:
  enabled: false

fusion:
  type: cross_attention
  use_tst1: true
  use_tst2: true
  cross_attention:
    n_heads: 8
    dropout: 0.1

finetune:
  epochs: 100
  batch_size: 32
  lr: 5e-5
  weight_decay: 1e-4
  patience: 20
  n_folds: 5
  freeze_tst1: false
  freeze_tst2: false
  feature_source: "pretrain"
  classifier:
    hidden_dims: [256, 64]
    dropout: 0.3
  save_dir: /root/workplace/exp/TwoTST/checkpoints/finetune/baseline_cross_attention

training:
  device: cuda
  seed: 42
  num_workers: 4

logging:
  log_dir: /root/workplace/exp/TwoTST/logs/baseline_cross_attention
  tensorboard: true
  save_best_only: true

evaluation:
  metrics: [auc, accuracy, sensitivity, specificity, f1]
  primary_metric: auc
